<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel | Found</title>
<meta name="description" content="Painel interno da Found.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='210 90 125 125'%3E%3Ccircle cx='271.5' cy='150.5' r='62' fill='%230a0a0a'/%3E%3Cpath fill='%23c8f000' d='M271.3 133.7Q274.8 147.7 288.8 151.2Q274.8 154.7 271.3 168.7Q267.8 154.7 253.8 151.2Q267.8 147.7 271.3 133.7Z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* =========================================================
   CORES E MEDIDAS (identidade da Found: preto + verde-limão)
   ========================================================= */
:root{
  --bg:#f4f4f2; --card:#fff; --ink:#0a0a0a; --muted:#55584f; --line:#e3e3df; --line-2:#ececea;
  --lime:#c8f000; --lime-deep:#a9cc00; --lime-soft:#f1fbc2;
  --radius:22px; --radius-sm:14px; --radius-xs:10px;
  --shadow-sm:0 1px 2px rgba(10,10,10,.04),0 6px 18px -8px rgba(10,10,10,.14);
  --shadow:0 1px 2px rgba(10,10,10,.05),0 18px 40px -16px rgba(10,10,10,.22);
  --menu:236px;
  --cinza-bg:#eceeea; --cinza:#45483f;
  --lilas-bg:#ece8fb; --lilas:#4b36a8;
  --azul-bg:#e3effd; --azul:#1a549e;
  --ambar-bg:#fff2c2; --ambar:#6f4e00;
  --rosa-bg:#fbe4ee; --rosa:#8f1d4f;
  --verm-bg:#fdecec; --verm:#a3161a;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Montserrat',system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
ul{margin:0;padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}

/* Portão: a página só aparece depois de conferir a sessão */
.portao{min-height:100vh;display:grid;place-items:center;color:var(--muted);font-weight:600;padding:20px;text-align:center}
body.travado .app{display:none}
body:not(.travado) .portao{display:none}

/* ============ ESTRUTURA ============ */
.app{min-height:100vh}
.menu{position:fixed;inset:0 auto 0 0;width:var(--menu);background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;z-index:40;transition:transform .25s ease}
.marca-painel{display:flex;align-items:center;gap:8px;padding:4px 10px 18px}
.marca-painel .logo-svg{height:18px;width:auto;color:var(--ink)}
.grupo{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:14px 10px 6px}
.menu nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-xs);text-decoration:none;font-weight:600;color:var(--muted);margin-bottom:2px}
.menu nav a:hover{background:var(--bg);color:var(--ink)}
.menu nav a[aria-current="page"]{background:var(--lime-soft);color:var(--ink);box-shadow:inset 0 0 0 1px #dff06e}
.menu nav a[aria-current="page"] svg{color:#4e6000}
.menu-pe{margin-top:auto;border-top:1px solid var(--line);padding:14px 10px 2px}
.menu-pe small{display:block;color:var(--muted);font-size:.72rem}
.menu-pe b{display:block;font-size:.8rem;font-weight:700;word-break:break-all;margin:2px 0 10px}
.btn-sair{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:var(--radius-xs);padding:7px 12px;font-weight:700;font-size:.82rem;cursor:pointer}
.btn-sair:hover{background:var(--bg)}
.veu{display:none}

.conteudo{margin-left:var(--menu);padding:22px 28px 60px;min-width:0}
.cabeca{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.cabeca h1{font-size:1.15rem;font-weight:800;letter-spacing:-.02em}
.cabeca p{color:var(--muted);font-size:.84rem}
.cabeca .ver-site{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:700;text-decoration:none;border:1px solid var(--line);background:var(--card);padding:7px 12px;border-radius:var(--radius-xs)}
.btn-menu{display:none;width:38px;height:38px;border-radius:var(--radius-xs);border:1px solid var(--line);background:var(--card);align-items:center;justify-content:center;cursor:pointer;flex:none}

@media (max-width:900px){
  .menu{transform:translateX(-100%);box-shadow:var(--shadow)}
  .menu.aberto{transform:none}
  .veu.aberto{display:block;position:fixed;inset:0;background:rgba(10,10,10,.35);z-index:35}
  .conteudo{margin-left:0;padding:14px 14px 50px}
  .btn-menu{display:inline-flex}
  .cabeca .ver-site span{display:none}
}

/* ============ AVISOS ============ */
#avisos{display:grid;gap:8px;margin-bottom:14px}
#avisos:empty{display:none}
.aviso{display:flex;align-items:flex-start;gap:10px;background:var(--ambar-bg);color:var(--ambar);border:1px solid #f3dc86;border-radius:var(--radius-sm);padding:10px 12px;font-weight:600;font-size:.84rem}
.aviso.erro{background:var(--verm-bg);color:var(--verm);border-color:#f6c9c9}
.aviso button{margin-left:auto;background:none;border:0;cursor:pointer;color:inherit;padding:0 2px;font-weight:800}

/* ============ PEÇAS COMUNS ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.bloco{padding:18px;margin-bottom:16px}
.bloco-topo{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.bloco-topo h2{font-size:.95rem;font-weight:800}
.bloco-topo .dir{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:0 12px;border-radius:var(--radius-xs);border:1px solid var(--line);background:var(--card);font-weight:700;font-size:.82rem;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn.escuro{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.escuro:hover{background:#242424}
.btn.perigo{color:var(--verm);border-color:#f3c7c7}
.btn.perigo:hover{background:var(--verm-bg)}
.btn svg.i{width:16px;height:16px}
.icone{width:30px;height:30px;display:inline-grid;place-items:center;border-radius:8px;border:0;background:none;cursor:pointer;color:var(--muted)}
.icone:hover{background:var(--bg);color:var(--ink)}
.icone svg.i{width:17px;height:17px}
.vazio{color:var(--muted);font-size:.86rem;padding:18px;text-align:center;background:var(--bg);border-radius:var(--radius-sm)}
.tag-ex{display:inline-block;font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;background:var(--ambar-bg);color:var(--ambar);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.pilula{display:inline-block;font-size:.74rem;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.p-cinza{background:var(--cinza-bg);color:var(--cinza)}
.p-lilas{background:var(--lilas-bg);color:var(--lilas)}
.p-azul{background:var(--azul-bg);color:var(--azul)}
.p-ambar{background:var(--ambar-bg);color:var(--ambar)}
.p-rosa{background:var(--rosa-bg);color:var(--rosa)}
.p-verde{background:var(--lime-soft);color:#3b4800}
.p-lima{background:var(--lime);color:var(--ink)}
.p-verm{background:var(--verm-bg);color:var(--verm)}

.campo-busca{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:var(--radius-xs);padding:0 10px;min-height:34px}
.campo-busca input{border:0;outline:0;background:none;min-width:0;width:190px;font-size:.84rem}
.campo-busca:focus-within{border-color:var(--ink)}
select.filtro{border:1px solid var(--line);background:var(--card);border-radius:var(--radius-xs);min-height:34px;padding:0 8px;font-size:.84rem;font-weight:600}

/* Faixa de números */
.faixa{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));margin-bottom:16px;overflow:hidden}
.faixa > div{padding:14px 16px;border-left:1px solid var(--line-2);min-width:0}
.faixa > div:first-child{border-left:0}
.faixa small{display:block;color:var(--muted);font-size:.74rem;font-weight:600}
.faixa b{display:block;font-size:1.1rem;font-weight:800;letter-spacing:-.02em;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.faixa em{display:block;font-style:normal;color:var(--muted);font-size:.74rem;margin-top:2px}
@media (max-width:760px){.faixa{grid-template-columns:repeat(2,minmax(0,1fr))}.faixa > div{border-left:0;border-top:1px solid var(--line-2)}.faixa > div:nth-child(-n+2){border-top:0}.faixa > div:nth-child(even){border-left:1px solid var(--line-2)}}

/* Tabelas */
.tabela-rola{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;font-size:.84rem}
th{text-align:left;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.clicavel{cursor:pointer}
tr.clicavel:hover td{background:#fafaf8}
td.acoes{white-space:nowrap;text-align:right}
td .fraco{color:var(--muted)}
td.trunca{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num{text-align:right;font-variant-numeric:tabular-nums}
th.num{text-align:right}
tr.fav td:first-child{box-shadow:inset 4px 0 0 var(--lime-deep)}
tr.fav td{background:#fcfdf6}
.estrela{color:#c9ccc2;border:0;background:none;cursor:pointer;padding:2px}
.estrela[aria-pressed="true"]{color:#7a9400}
.estrela[aria-pressed="true"] svg.i{fill:var(--lime);stroke:#5f7400}
.prazo-tag{display:inline-block;margin-left:6px;font-size:.68rem;font-weight:800;border-radius:6px;padding:1px 6px;white-space:nowrap}
.prazo-tag.atraso{background:var(--verm-bg);color:var(--verm)}
.prazo-tag.perto{background:var(--ambar-bg);color:var(--ambar)}

/* ============ CLIENTES ============ */
.contagem{color:var(--muted);font-size:.8rem;font-weight:600}
.zap{display:inline-flex;align-items:center;gap:4px;margin-left:6px;font-size:.72rem;font-weight:800;background:var(--lime-soft);color:#3b4800;border-radius:999px;padding:2px 8px;text-decoration:none}
.zap:hover{background:var(--lime)}
.insta{text-decoration:none;font-weight:700}
.insta:hover{text-decoration:underline}

/* ============ CALENDÁRIO ============ */
.cal-topo{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.cal-topo h2{font-size:.98rem;font-weight:800;min-width:150px}
.grade{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--line-2);gap:1px}
.grade .sem{background:var(--card);font-size:.7rem;font-weight:800;text-transform:uppercase;color:var(--muted);padding:6px 8px;letter-spacing:.04em}
.dia-cel{background:var(--card);min-height:104px;padding:6px;position:relative;cursor:pointer;min-width:0}
.dia-cel:hover{background:#fafaf8}
.dia-cel.fora{background:#f9f9f7}
.dia-cel.fora .n{color:#b6b8ad}
.dia-cel .n{font-size:.78rem;font-weight:700;display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:999px}
.dia-cel.hoje .n{background:var(--ink);color:#fff}
.dia-cel.hoje{box-shadow:inset 0 0 0 2px var(--lime-deep)}
.mais-dia{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:8px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;opacity:0;cursor:pointer;color:var(--ink)}
.mais-dia svg.i{width:14px;height:14px}
.dia-cel:hover .mais-dia,.mais-dia:focus-visible{opacity:1}
.itens-dia{display:grid;gap:3px;margin-top:4px}
.item-cal{display:block;width:100%;text-align:left;border:0;border-left:3px solid;border-radius:5px;padding:2px 6px;font-size:.72rem;font-weight:700;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-gravar{background:var(--lime-soft);border-color:var(--lime-deep);color:#2f3a00}
.t-editar{background:var(--lilas-bg);border-color:#8a74e0;color:var(--lilas)}
.t-postar{background:var(--azul-bg);border-color:#5b95dc;color:var(--azul)}
.t-reuniao{background:var(--rosa-bg);border-color:#d9709f;color:var(--rosa)}
.t-prazo{background:var(--verm-bg);border-color:#e57373;color:var(--verm)}
.item-cal.feito{text-decoration:line-through;opacity:.55}
.ver-mais{border:0;background:none;padding:1px 6px;font-size:.72rem;font-weight:800;color:var(--muted);cursor:pointer;text-align:left}
.ver-mais:hover{color:var(--ink);text-decoration:underline}
.legenda-cal{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:.76rem;color:var(--muted);font-weight:600}
.legenda-cal span{display:inline-flex;align-items:center;gap:6px}
.legenda-cal i{width:10px;height:10px;border-radius:3px;border-left:3px solid}
.atrasados li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:.84rem}
.atrasados li:last-child{border-bottom:0}
.atrasados .quando{margin-left:auto;white-space:nowrap}
@media (max-width:700px){
  .dia-cel{min-height:62px;padding:4px}
  .grade .item-cal{font-size:0;height:6px;padding:0;border-left-width:0;border-radius:3px}
  .grade .sem{padding:5px 2px;text-align:center;font-size:.62rem}
}

/* ============ HOJE, TAREFAS E CHECKLIST ============ */
.saudacao{margin-bottom:14px}
.saudacao h2{font-size:1rem;font-weight:800}
.saudacao p{color:var(--muted);font-size:.84rem}
.rapido{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px}
.rapido.sem-borda{padding:0 0 10px}
.rapido input:not([type=date]){flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:var(--radius-xs);min-height:36px;padding:0 12px;font-size:.88rem}
.rapido input:focus{outline:none;border-color:var(--ink);background:#fff;box-shadow:0 0 0 3px var(--lime)}
.lista-tarefas li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-2)}
.lista-tarefas li:last-child{border-bottom:0}
.lista-tarefas input[type=checkbox]{width:18px;height:18px;accent-color:#7a9400;cursor:pointer;flex:none;margin:0}
.tarefa-t{flex:1;min-width:0;text-align:left;border:0;background:none;padding:0;font-weight:600;font-size:.88rem;cursor:pointer}
.lista-tarefas li.feita .tarefa-t{text-decoration:line-through;color:var(--muted)}
.mini-lista li{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line-2);font-size:.84rem}
.mini-lista li:last-child{border-bottom:0}
.mini-lista .dir-item{margin-left:auto;white-space:nowrap}
.duas{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
@media (max-width:1000px){.duas{grid-template-columns:1fr}}

/* Checklist */
.progresso{height:7px;border-radius:7px;background:var(--line-2);overflow:hidden}
.progresso i{display:block;height:100%;width:0;background:var(--lime-deep);border-radius:7px;transition:width .3s ease}
.geral{display:flex;align-items:center;gap:14px;padding:14px 18px;margin-bottom:12px}
.geral b{font-size:.9rem;white-space:nowrap}
.geral .progresso{flex:1}
details.sec{margin-bottom:10px;overflow:hidden}
details.sec > summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 12px;padding:14px 18px}
details.sec > summary::-webkit-details-marker{display:none}
details.sec > summary h3{font-size:.92rem;font-weight:800}
details.sec > summary .conta{font-size:.76rem;font-weight:800;color:var(--muted);text-align:right;min-width:90px}
details.sec > summary .conta .progresso{margin-top:6px}
details.sec[open] > summary{border-bottom:1px solid var(--line-2)}
.sec-corpo{padding:14px 18px 16px}
.item-ck{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line-2);cursor:pointer}
.item-ck:last-child{border-bottom:0}
.item-ck input{width:17px;height:17px;margin:2px 0 0;accent-color:#7a9400;flex:none;cursor:pointer}
.item-ck b{display:block;font-size:.86rem;font-weight:700}
.item-ck small{display:block;color:var(--muted);font-size:.8rem}
.item-ck input:checked + span b{text-decoration:line-through;color:var(--muted)}

/* ============ DASHBOARD (visitas) ============ */
.grafico{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:18px}
.grafico .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.grafico .barra{width:100%;max-width:30px;background:var(--lime);border:1px solid var(--lime-deep);border-radius:6px 6px 3px 3px;min-height:3px;position:relative}
.grafico .barra.zero{background:var(--line-2);border-color:var(--line-2)}
.grafico .barra span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:.68rem;font-weight:800}
.grafico .dia{font-size:.66rem;color:var(--muted);margin-top:5px;font-weight:600}
.grafico .col.hoje .dia{color:var(--ink);font-weight:800}
.origens li{display:grid;grid-template-columns:1fr auto;gap:4px 10px;margin-bottom:10px;font-size:.84rem}
.origens li b{font-weight:700}
.origens li span{color:var(--muted);font-variant-numeric:tabular-nums}
.origens li i{grid-column:1/-1;height:6px;border-radius:6px;background:var(--line-2);overflow:hidden}
.origens li i::before{content:"";display:block;height:100%;width:var(--p);background:var(--lime-deep);border-radius:6px}

/* ============ IDEIAS (quadro) ============ */
.quadro{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:1000px){.quadro{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.quadro{grid-template-columns:1fr}}
.coluna{background:#eceee9;border-radius:var(--radius);padding:10px}
.coluna h3{font-size:.76rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:4px 6px 10px;display:flex;gap:6px;align-items:center}
.coluna h3 span{background:var(--card);border-radius:999px;padding:0 8px;font-size:.72rem}
.coluna .vazio{padding:10px;font-size:.78rem;background:none}
.ideia-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow-sm)}
.ideia-card:hover{border-color:#cfd3c9}
.ideia-card b{display:block;font-size:.86rem}
.ideia-card p{font-size:.8rem;color:var(--muted);margin-top:4px}
.ideia-card .meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.ideia-card .acoes-card{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ideia-card .acoes-card:empty{display:none}
.ideia-card .acoes-card .btn{min-height:28px;padding:0 8px;font-size:.74rem}

/* ============ RADAR DE NOVIDADES ============ */
.fontes{display:flex;flex-wrap:wrap;gap:8px}
.fontes a{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:700;text-decoration:none;background:var(--card)}
.fontes a:hover{background:var(--lime-soft);border-color:#dff06e}
.fontes svg.i{width:13px;height:13px}
.seg{display:inline-flex;background:var(--bg);border-radius:var(--radius-xs);padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:8px;padding:5px 12px;font-weight:700;font-size:.8rem;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow-sm)}
.grade-radar{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.radar-card{padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.radar-card:hover{border-color:#cfd3c9}
.radar-card.fixada{box-shadow:inset 0 3px 0 var(--lime-deep),var(--shadow-sm)}
.radar-card h3{font-size:.92rem;font-weight:800;line-height:1.3}
.radar-card .nota{font-size:.82rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.radar-topo,.radar-pe{display:flex;align-items:center;gap:6px}
.radar-topo .icone{margin-left:auto}
.radar-pe{margin-top:auto;flex-wrap:wrap}
.radar-pe select{border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:.76rem;font-weight:700;padding:3px 6px}
.radar-pe .btn{margin-left:auto;min-height:28px;font-size:.76rem}
.fixa[aria-pressed="true"]{color:#7a9400}
.fixa[aria-pressed="true"] svg.i{fill:var(--lime)}

/* ============ LINKS ÚTEIS ============ */
.grupos-links{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start}
.grupos-links section.card{padding:14px 16px}
.grupos-links h2{font-size:.88rem;font-weight:800;margin-bottom:6px;display:flex;gap:6px;align-items:center}
.grupos-links h2 span{color:var(--muted);font-weight:700;font-size:.74rem}
.link-li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-2)}
.link-li:last-child{border-bottom:0}
.letra{width:32px;height:32px;border-radius:9px;background:var(--lime-soft);display:grid;place-items:center;font-weight:800;font-size:.84rem;flex:none}
.link-li > div{flex:1;min-width:0}
.link-li a{font-weight:700;font-size:.86rem;text-decoration:none}
.link-li a:hover{text-decoration:underline}
.link-li small{display:block;color:var(--muted);font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ============ JANELA (MODAL) ============ */
.fundo-modal{position:fixed;inset:0;z-index:80;background:rgba(10,10,10,.45);display:grid;place-items:center;padding:16px}
.modal{width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow-y:auto;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.modal-topo{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}
.modal-topo h2{font-size:1rem;font-weight:800;letter-spacing:-.01em}
.modal-topo p{font-size:.8rem;color:var(--muted)}
.modal-topo .icone{margin-left:auto}
.form-grade{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grade .inteiro{grid-column:1/-1}
@media (max-width:520px){.form-grade{grid-template-columns:1fr}}
.campo label{display:block;font-weight:700;font-size:.78rem;margin-bottom:4px}
.campo input,.campo select,.campo textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:var(--radius-xs);padding:8px 10px;font-size:.86rem}
.campo textarea{min-height:90px;resize:vertical}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:none;border-color:var(--ink);background:#fff;box-shadow:0 0 0 3px var(--lime)}
.campo .dica{font-size:.74rem;color:var(--muted);margin-top:3px}
.modal-pe{display:flex;align-items:center;gap:8px;margin-top:18px}
.modal-pe .dir{margin-left:auto;display:flex;gap:8px}
.erro-form{color:var(--verm);font-weight:700;font-size:.8rem;margin-top:10px}
.lista-dia li{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.lista-dia .item-cal{font-size:.84rem;padding:7px 10px}

/* Aviso rápido no canto */
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-weight:700;font-size:.84rem;z-index:90;box-shadow:var(--shadow)}
</style>

<script>
/* =========================================================
   1) PORTÃO: antes de tudo, confere se você está logada.
   Sem sessão, volta pro login. A página só aparece depois disso.
   ========================================================= */
(function portao() {
  var banco = window.banco;
  var msg = document.getElementById("portao");
  if (!banco) { msg.textContent = "Não consegui carregar a ligação com o banco. Confira js/banco.js (preencha SUPABASE_URL e SUPABASE_CHAVE) e a internet."; return; }

  // Olhamos o próprio link, em vez de depender só do evento do Supabase
  // (o evento às vezes não chega a tempo). Um link de "esqueci minha senha"
  // sempre carrega "type=recovery" no final do endereço, seja na parte
  // depois do # ou depois do ?.
  var ehRecuperacao = /type=recovery/.test(location.hash) || /type=recovery/.test(location.search);

  banco.auth.getSession().then(function (r) {
    var sessao = r && r.data && r.data.session;
    if (!sessao) { location.replace("../login/"); return; }
    if (ehRecuperacao) { mostraFormNovaSenha(sessao); return; }
    document.body.classList.remove("travado");
    iniciar(sessao);
  }).catch(function () { location.replace("../login/"); });
})();

/* Quando o link de "esqueci minha senha" é clicado, o Supabase já loga a
   sessão sozinho antes de redirecionar pra cá. Por isso, em vez de abrir
   o painel direto, mostramos essa telinha pra você escolher a senha nova. */
function mostraFormNovaSenha(sessao) {
  var msg = document.getElementById("portao");
  msg.innerHTML =
    '<div style="max-width:360px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;font-weight:400">' +
    '<h2 style="font-size:1.05rem;font-weight:800;margin-bottom:6px;">Defina sua nova senha</h2>' +
    '<p style="color:var(--muted);font-size:.86rem;margin-bottom:16px;">Antes de continuar, escolha a nova senha para entrar no painel.</p>' +
    '<div class="campo" style="margin-bottom:12px;"><label>Nova senha</label><input type="password" id="nova-senha" minlength="6"></div>' +
    '<div class="campo" style="margin-bottom:14px;"><label>Confirmar senha</label><input type="password" id="confirma-senha" minlength="6"></div>' +
    '<div class="erro-form" id="erro-nova-senha" hidden></div>' +
    '<button class="btn escuro" type="button" id="salvar-nova-senha" style="width:100%;margin-top:10px;">Salvar nova senha</button>' +
    "</div>";
  document.getElementById("salvar-nova-senha").addEventListener("click", function () {
    var nova = document.getElementById("nova-senha").value;
    var conf = document.getElementById("confirma-senha").value;
    var erroEl = document.getElementById("erro-nova-senha");
    erroEl.hidden = true;
    if (nova.length < 6) { erroEl.hidden = false; erroEl.textContent = "A senha precisa ter pelo menos 6 caracteres."; return; }
    if (nova !== conf) { erroEl.hidden = false; erroEl.textContent = "As senhas não são iguais."; return; }
    var btn = document.getElementById("salvar-nova-senha");
    btn.disabled = true;
    window.banco.auth.updateUser({ password: nova }).then(function (r) {
      btn.disabled = false;
      if (r.error) { erroEl.hidden = false; erroEl.textContent = "Não foi possível salvar: " + r.error.message; return; }
      document.body.classList.remove("travado");
      iniciar(sessao);
    });
  });
}

/* ---------- utilidades ---------- */
function $(s, c) { return (c || document).querySelector(s); }
function $$(s, c) { return Array.prototype.slice.call((c || document).querySelectorAll(s)); }
function esc(t) { return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function pad(n) { return String(n).padStart(2, "0"); }
function isoLocal(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function hojeISO() { return isoLocal(new Date()); }
function lerData(iso) { if (!iso) return null; var p = String(iso).slice(0, 10).split("-").map(Number); if (p.length < 3 || p.some(isNaN)) return null; return new Date(p[0], p[1] - 1, p[2]); }
function diasAte(iso) { var d = lerData(iso); if (!d) return null; var h = lerData(hojeISO()); return Math.round((d - h) / 864e5); }
function fmtData(iso) { var d = lerData(iso); return d ? pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear() : ""; }
function numero(v) { var n = Number(v); return isFinite(n) ? n : 0; }
function moeda(v) { return numero(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); }
function ehExemplo(t) { return /^\s*EXEMPLO/i.test(t || ""); }
function tagEx(t) { return ehExemplo(t) ? '<span class="tag-ex">exemplo</span>' : ""; }
function semEx(t) { return String(t || "").replace(/^\s*EXEMPLO\s*·?\s*/i, ""); }
function contaPor(lista, fn) { var m = {}; lista.forEach(function (x) { var k = fn(x); if (k) m[k] = (m[k] || 0) + 1; }); return m; }
function maior(mapa) { var melhor = null, n = 0; Object.keys(mapa).forEach(function (k) { if (mapa[k] > n) { n = mapa[k]; melhor = k; } }); return melhor; }
function urlSegura(u) { u = String(u || "").trim(); if (!u) return ""; if (/^https?:\/\//i.test(u)) return u; if (/^[a-z][a-z0-9+.-]*:/i.test(u)) return ""; return "https://" + u; }
function hostDe(u) { try { return new URL(urlSegura(u)).hostname.replace(/^www\./, ""); } catch (e) { return ""; } }
function haQuanto(ts) { if (!ts) return ""; var d = Math.floor((lerData(hojeISO()) - lerData(isoLocal(new Date(ts)))) / 864e5); return d <= 0 ? "hoje" : d === 1 ? "ontem" : "há " + d + " dias"; }

/* ---------- avisos (nunca deixam o painel em branco) ---------- */
var avisosVistos = {};
function avisa(texto, tipo) {
  if (!texto || avisosVistos[texto]) return;
  avisosVistos[texto] = true;
  var d = document.createElement("div");
  d.className = "aviso" + (tipo === "erro" ? " erro" : "");
  d.innerHTML = "<span>" + esc(texto) + '</span><button type="button" aria-label="Fechar aviso">' + icone("x") + "</button>";
  d.querySelector("button").addEventListener("click", function () { d.remove(); delete avisosVistos[texto]; });
  $("#avisos").appendChild(d);
}
function explicaErro(tabela, erro) {
  var c = (erro && erro.code) || "", m = (erro && (erro.message || String(erro))) || "";
  if (/jwt|token.*expired|not authenticated/i.test(m)) { location.replace("../login/"); return ""; }
  if (c === "42P01" || /relation .* does not exist/i.test(m)) return "A tabela \"" + tabela + "\" ainda não existe no banco. Cole o conteúdo de banco.sql no SQL Editor do Supabase e rode.";
  if (/row-level security|permission denied/i.test(m)) return "Sem permissão para acessar \"" + tabela + "\". Confira se o seu e-mail está certo na função e_a_dona() do banco.sql.";
  return "Não consegui falar com \"" + tabela + "\" agora (" + m + ").";
}
function toast(texto) {
  var d = document.createElement("div");
  d.className = "toast";
  d.textContent = texto;
  document.body.appendChild(d);
  setTimeout(function () { d.remove(); }, 2200);
}

/* =========================================================
   4) BUSCA GENÉRICA NO BANCO
   ========================================================= */
function buscaTudo(tabela, ordenaPor, asc) {
  var q = banco.from(tabela).select("*");
  if (ordenaPor) q = q.order(ordenaPor, { ascending: !!asc });
  return q.then(function (r) {
    if (r.error) { avisa(explicaErro(tabela, r.error), "erro"); return []; }
    return r.data || [];
  }).catch(function () { avisa("Não consegui falar com \"" + tabela + "\" agora.", "erro"); return []; });
}
function salvar(tabela, linha, id) {
  var p = id ? banco.from(tabela).update(linha).eq("id", id) : banco.from(tabela).insert(linha);
  return p.then(function (r) { if (r.error) { avisa(explicaErro(tabela, r.error), "erro"); return false; } return true; });
}
function apagar(tabela, id) {
  return banco.from(tabela).delete().eq("id", id).then(function (r) { if (r.error) { avisa(explicaErro(tabela, r.error), "erro"); return false; } return true; });
}

function carregaDashboard() {

  buscaTudo("found_visitas", "data").then(function (lista) {

function desenhaDashboard(desde) {
  var raiz = $("#aba-dashboard");
  var dias = [], contagem = {};
  for (var i = 0; i < 14; i++) { var d = new Date(desde); d.setDate(desde.getDate() + i); dias.push(isoLocal(d)); contagem[isoLocal(d)] = 0; }
  E.visitas.forEach(function (v) { if (!v.data) return; var k = isoLocal(new Date(v.data)); if (k in contagem) contagem[k]++; });
  var total = dias.reduce(function (a, k) { return a + contagem[k]; }, 0);
  var hoje = contagem[hojeISO()] || 0;
  var origens = contaPor(E.visitas, function (v) { return v.origem || "direto"; });
  var origemTop = maior(origens);

  var faixa = '<div class="card faixa" style="--n:3">' +
    "<div><small>Visitas em 14 dias</small><b>" + total + "</b></div>" +
    "<div><small>Visitas hoje</small><b>" + hoje + "</b></div>" +
    '<div><small>De onde mais vêm</small><b title="' + esc(origemTop || "") + '">' + esc(origemTop || "Ninguém ainda") + "</b></div></div>";

  var grafico;
  if (total === 0) grafico = '<p class="vazio">Quando as pessoas começarem a visitar o site da Found, aqui aparece uma barrinha por dia dos últimos 14 dias.</p>';
  else {
    var max = Math.max.apply(null, dias.map(function (k) { return contagem[k]; })) || 1;
    grafico = '<div class="grafico" role="img" aria-label="Visitas por dia nos últimos 14 dias">' + dias.map(function (k) {
      var n = contagem[k], dd = lerData(k);
      return '<div class="col' + (k === hojeISO() ? " hoje" : "") + '" title="' + fmtData(k) + ": " + n + (n === 1 ? " visita" : " visitas") + '">' +
        '<div class="barra' + (n ? "" : " zero") + '" style="height:' + (n ? Math.max(4, Math.round(n / max * 100)) : 2) + '%">' + (n ? "<span>" + n + "</span>" : "") + "</div>" +
        '<span class="dia">' + pad(dd.getDate()) + "</span></div>";
    }).join("") + "</div>";
  }

  var chaves = Object.keys(origens).sort(function (a, b) { return origens[b] - origens[a]; });
  var listaOrigens = !chaves.length
    ? '<p class="vazio">Aqui vai aparecer por onde as pessoas chegaram até o site: Instagram, Google, WhatsApp ou link direto.</p>'
    : '<ul class="origens">' + chaves.map(function (k) {
        var pct = total ? Math.round(origens[k] / total * 100) : 0;
        return "<li><b>" + esc(k) + "</b><span>" + origens[k] + " · " + pct + '%</span><i style="--p:' + pct + '%"></i></li>';
      }).join("") + "</ul>";

  raiz.innerHTML = faixa +
    '<div class="duas"><section class="card bloco"><div class="bloco-topo"><h2>Visitas nos últimos 14 dias</h2></div>' + grafico + "</section>" +
    '<section class="card bloco"><div class="bloco-topo"><h2>Por onde chegaram</h2></div>' + listaOrigens + "</section></div>";
}

/* =========================================================
   9) ABA CALENDÁRIO
   ========================================================= */
var calMes = new Date(); calMes.setDate(1);
function carregaCalendario() {
  var raiz = $("#aba-calendario");
  raiz.innerHTML =
    '<section class="card bloco">' +
    '<div class="cal-topo"><button class="icone" id="cal-ant" type="button" aria-label="Mês anterior"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>' +
    '<h2 id="cal-titulo"></h2>' +
    '<button class="icone" id="cal-prox" type="button" aria-label="Próximo mês"><svg class="i" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>' +
    '<button class="btn" id="cal-hoje" type="button">Hoje</button>' +
    '<button class="btn escuro" id="cal-novo" type="button" style="margin-left:auto">' + icone("mais") + "Novo compromisso</button></div>" +
    '<div class="grade" id="cal-grade"></div>' +
    '<div class="legenda-cal">' + TIPOS_CAL.map(function (t) { return '<span><i class="t-' + t[0] + '"></i>' + t[1] + "</span>"; }).join("") + "</div>" +
    "</section>";

  buscaTudo("found_calendario", "data").then(function (lista) { E.calendario = lista; renderizaCalendario(); });

  $("#cal-ant").addEventListener("click", function () { calMes.setMonth(calMes.getMonth() - 1); renderizaCalendario(); });
  $("#cal-prox").addEventListener("click", function () { calMes.setMonth(calMes.getMonth() + 1); renderizaCalendario(); });
  $("#cal-hoje").addEventListener("click", function () { calMes = new Date(); calMes.setDate(1); renderizaCalendario(); });
  $("#cal-novo").addEventListener("click", function () { abreModalCalendario(null, hojeISO()); });
}
function renderizaCalendario() {
  $("#cal-titulo").textContent = calMes.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
  var primeiro = new Date(calMes.getFullYear(), calMes.getMonth(), 1);
  var inicioGrade = new Date(primeiro); inicioGrade.setDate(1 - primeiro.getDay());
  var dias = [];
  for (var i = 0; i < 42; i++) { var d = new Date(inicioGrade); d.setDate(inicioGrade.getDate() + i); dias.push(d); }
  var porDia = {};
  E.calendario.forEach(function (c) { (porDia[c.data] = porDia[c.data] || []).push(c); });

  var nomesSem = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
  var html = nomesSem.map(function (n) { return '<div class="sem">' + n + "</div>"; }).join("");
  html += dias.map(function (d) {
    var iso = isoLocal(d);
    var fora = d.getMonth() !== calMes.getMonth();
    var ehHoje = iso === hojeISO();
    var itens = (porDia[iso] || []).slice(0, 4);
    return '<div class="dia-cel ' + (fora ? "fora" : "") + " " + (ehHoje ? "hoje" : "") + '" data-dia="' + iso + '">' +
      '<span class="n">' + d.getDate() + "</span>" +
      '<button class="mais-dia" type="button" data-add="' + iso + '" aria-label="Adicionar">' + icone("mais") + "</button>" +
      '<div class="itens-dia">' + itens.map(function (c) { return '<button type="button" class="item-cal t-' + c.tipo + " " + (c.feito ? "feito" : "") + '" data-item="' + c.id + '">' + esc(c.titulo) + "</button>"; }).join("") +
      ((porDia[iso] || []).length > 4 ? '<span class="ver-mais" data-vermais="' + iso + '">+' + ((porDia[iso] || []).length - 4) + " mais</span>" : "") +
      "</div></div>";
  }).join("");
  $("#cal-grade").innerHTML = html;

  $$("#cal-grade [data-add]").forEach(function (b) { b.addEventListener("click", function (ev) { ev.stopPropagation(); abreModalCalendario(null, b.dataset.add); }); });
  $$("#cal-grade [data-item]").forEach(function (b) { b.addEventListener("click", function (ev) { ev.stopPropagation(); abreModalCalendario(b.dataset.item, null); }); });
  $$("#cal-grade [data-vermais]").forEach(function (b) { b.addEventListener("click", function (ev) { ev.stopPropagation(); abreListaDia(b.dataset.vermais, porDia[b.dataset.vermais] || []); }); });
  $$("#cal-grade .dia-cel").forEach(function (cel) { cel.addEventListener("click", function () { abreModalCalendario(null, cel.dataset.dia); }); });
}
function abreListaDia(iso, itens) {
  var corpo = '<ul class="lista-dia">' + itens.map(function (c) { return '<li><button type="button" class="item-cal t-' + c.tipo + '" data-item="' + c.id + '" style="flex:1;text-align:left">' + esc(c.titulo) + "</button></li>"; }).join("") + "</ul>";
  abreModal({ titulo: fmtData(iso), corpo: corpo, semSalvar: true });
  $$('#janela-modal [data-item]').forEach(function (b) { b.addEventListener("click", function () { abreModalCalendario(b.dataset.item, null); }); });
}
function abreModalCalendario(id, diaPreenchido) {
  var c = id ? E.calendario.find(function (x) { return x.id === id; }) : null;
  var opcoesClientes = '<option value="">Sem cliente vinculado</option>' + E.clientes.map(function (cl) { return '<option value="' + cl.id + '"' + (c && c.cliente_id === cl.id ? " selected" : "") + ">" + esc(semEx(cl.nome)) + "</option>"; }).join("");
  var corpo =
    '<div class="form-grade">' +
    '<div class="campo inteiro"><label>Título</label><input id="f-ctitulo" value="' + esc(c ? c.titulo : "") + '" placeholder="Ex.: Reunião de briefing"></div>' +
    '<div class="campo"><label>Tipo</label><select id="f-ctipo">' + TIPOS_CAL.map(function (t) { return '<option value="' + t[0] + '"' + (c && c.tipo === t[0] ? " selected" : "") + ">" + t[1] + "</option>"; }).join("") + "</select></div>" +
    '<div class="campo"><label>Data</label><input id="f-cdata" type="date" value="' + (c ? c.data : (diaPreenchido || hojeISO())) + '"></div>' +
    '<div class="campo inteiro"><label>Cliente</label><select id="f-ccliente">' + opcoesClientes + "</select></div>" +
    (c ? '<div class="campo check inteiro"><label><input type="checkbox" id="f-cfeito" ' + (c.feito ? "checked" : "") + "> Marcar como concluído</label></div>" : "") +
    '<div class="campo inteiro"><label>Nota</label><textarea id="f-cnota">' + esc(c ? c.nota : "") + "</textarea></div>" +
    "</div>";
  abreModal({
    titulo: c ? "Editar compromisso" : "Novo compromisso",
    corpo: corpo,
    excluir: c ? function () { confirmaApagar("found_calendario", c.id, function () { fechaModal(); carregaCalendario(); }); } : null,
    salvar: function () {
      var titulo = $("#f-ctitulo").value.trim();
      if (!titulo) return "Informe o título.";
      var data = $("#f-cdata").value;
      if (!data) return "Informe a data.";
      var linha = { titulo: titulo, tipo: $("#f-ctipo").value, data: data, cliente_id: $("#f-ccliente").value || null, nota: $("#f-cnota").value.trim() || null };
      if (c) linha.feito = $("#f-cfeito").checked;
      return salvar("found_calendario", linha, c ? c.id : null).then(function (ok) { if (ok) { fechaModal(); carregaCalendario(); } return ok ? "" : "Não foi possível salvar."; });
    }
  });
}

   10) ABA TAREFAS
   ========================================================= */
function carregaTarefas() {
  var raiz = $("#aba-tarefas");
  raiz.innerHTML =
    '<section class="card bloco">' +
    '<form class="rapido sem-borda" id="tar-form"><input type="text" id="tar-novo" placeholder="Nova tarefa e tecle Enter" required><input type="date" id="tar-data"><button class="btn escuro" type="submit">' + icone("mais") + "Adicionar</button></form>" +
    '<ul class="lista-tarefas" id="tar-corpo"></ul>' +
    "</section>";

  buscaTudo("found_tarefas", "criado_em", false).then(function (lista) { E.tarefas = lista; renderizaTarefas(); });

  $("#tar-form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var titulo = $("#tar-novo").value.trim();
    if (!titulo) return;
    salvar("found_tarefas", { titulo: titulo, data: $("#tar-data").value || null }).then(function (ok) {
      if (ok) { $("#tar-novo").value = ""; $("#tar-data").value = ""; carregaTarefas(); }
    });
  });
}
function renderizaTarefas() {
  var corpo = $("#tar-corpo");
  if (!E.tarefas.length) { corpo.innerHTML = '<li class="vazio">Nenhuma tarefa ainda.</li>'; return; }
  var ordenadas = E.tarefas.slice().sort(function (a, b) { return (a.feita - b.feita) || (a.data || "").localeCompare(b.data || ""); });
  corpo.innerHTML = ordenadas.map(linhaTarefaCompleta).join("");
  ligaTarefas(corpo, true);
}
function linhaTarefaCompleta(t) {
  return '<li class="' + (t.feita ? "feita" : "") + '" data-id="' + t.id + '"><input type="checkbox" ' + (t.feita ? "checked" : "") + '><button type="button" class="tarefa-t">' + esc(t.titulo) + (t.data ? ' <span class="fraco" style="font-weight:600">· ' + fmtData(t.data) + "</span>" : "") + '</button><button class="icone" type="button" data-apagar="' + t.id + '" aria-label="Apagar">' + icone("lixo") + "</button></li>";
}
function ligaTarefas(raiz, comApagar) {
  $$("li[data-id] input[type=checkbox]", raiz).forEach(function (cb) {
    cb.addEventListener("change", function () {
      var li = cb.closest("li");
      var t = E.tarefas.find(function (x) { return x.id === li.dataset.id; });
      salvar("found_tarefas", { feita: cb.checked }, li.dataset.id).then(function (ok) {
        if (ok) { if (t) t.feita = cb.checked; li.classList.toggle("feita", cb.checked); if (comApagar) renderizaTarefas(); }
      });
    });
  });
  if (comApagar) {
    $$("li[data-id] [data-apagar]", raiz).forEach(function (b) {
      b.addEventListener("click", function () { confirmaApagar("found_tarefas", b.dataset.apagar, carregaTarefas); });
    });
  }
}

   11) ABA CHECKLIST
   ========================================================= */
function carregaChecklist() {
  var raiz = $("#aba-checklist");
  raiz.innerHTML = '<div class="geral card"><b id="ck-geral-txt"></b><div class="progresso"><i id="ck-geral-barra"></i></div></div><div id="ck-secoes"></div>';
  buscaTudo("found_checklist_itens", "ordem").then(function (lista) { E.checklist = lista; renderizaChecklist(); });
}
function renderizaChecklist() {
  var categorias = [];
  E.checklist.forEach(function (i) { if (categorias.indexOf(i.categoria) === -1) categorias.push(i.categoria); });
  var feitosGeral = E.checklist.filter(function (i) { return i.feito; }).length;
  var totalGeral = E.checklist.length;
  $("#ck-geral-txt").textContent = "Progresso geral: " + feitosGeral + "/" + totalGeral;
  $("#ck-geral-barra").style.width = (totalGeral ? Math.round(feitosGeral / totalGeral * 100) : 0) + "%";

  var raizSec = $("#ck-secoes");
  if (!categorias.length) { raizSec.innerHTML = '<div class="vazio card bloco">Nenhum item de checklist ainda. Edite o banco.sql ou adicione direto no Supabase.</div>'; return; }
  raizSec.innerHTML = categorias.map(function (cat, idx) {
    var itens = E.checklist.filter(function (i) { return i.categoria === cat; });
    var feitos = itens.filter(function (i) { return i.feito; }).length;
    return '<details class="sec card" ' + (idx === 0 ? "open" : "") + '>' +
      '<summary><h3>' + esc(cat) + '</h3><span class="conta">' + feitos + "/" + itens.length + '<div class="progresso"><i style="width:' + (itens.length ? Math.round(feitos / itens.length * 100) : 0) + '%"></i></div></span></summary>' +
      '<div class="sec-corpo">' + itens.map(function (i) {
        return '<label class="item-ck" data-id="' + i.id + '"><input type="checkbox" ' + (i.feito ? "checked" : "") + '><span><b>' + esc(semEx(i.titulo)) + "</b>" + tagEx(i.titulo) + (i.descricao ? "<small>" + esc(i.descricao) + "</small>" : "") + "</span></label>";
      }).join("") + "</div></details>";
  }).join("");

  $$("#ck-secoes .item-ck input").forEach(function (cb) {
    cb.addEventListener("change", function () {
      var label = cb.closest(".item-ck");
      var item = E.checklist.find(function (x) { return x.id === label.dataset.id; });
      salvar("found_checklist_itens", { feito: cb.checked }, label.dataset.id).then(function (ok) { if (ok) { item.feito = cb.checked; renderizaChecklist(); } });
    });
  });
}

function carregaIdeias() {
  var raiz = $("#aba-ideias");
  raiz.innerHTML =
    '<section class="card bloco"><div class="bloco-topo"><span class="contagem">Leve cada ideia de coluna em coluna até postar.</span>' +
    '<div class="dir"><button type="button" class="btn escuro" id="ideia-nova">' + icone("mais") + 'Nova ideia</button></div></div>' +
    '<div id="quadro-ideias"><p class="vazio">Carregando...</p></div></section>';

  Promise.all([buscaTudo("found_ideias", "criado_em", false), buscaTudo("found_clientes")]).then(function (r) {
    E.ideias = r[0]; if (!E.clientes.length) E.clientes = r[1];
    desenhaQuadroIdeias();
  });

  $("#ideia-nova").addEventListener("click", function () { abreModalIdeia(null); });
}
function desenhaQuadroIdeias() {
  var alvo = $("#quadro-ideias"); if (!alvo) return;
  alvo.innerHTML = '<div class="quadro">' + STATUS_IDEIA.map(function (st, k) {
    var lista = E.ideias.filter(function (i) { return (i.status || "ideia") === st[0]; });
    return '<div class="coluna"><h3>' + st[1] + ' <span>' + lista.length + '</span></h3>' +
      (lista.length ? lista.map(function (i) {
        return '<article class="ideia-card" tabindex="0" data-id="' + i.id + '"><b>' + esc(i.titulo) + '</b>' +
          (i.gancho ? '<p>' + esc(i.gancho) + '</p>' : '') +
          ((i.formato || i.cliente_id) ? '<div class="meta">' + (i.formato ? '<span class="pilula p-cinza">' + esc(i.formato) + '</span>' : '') + (i.cliente_id ? '<span class="pilula p-verde">' + esc(nomeCliente(i.cliente_id)) + '</span>' : '') + '</div>' : '') +
          '<div class="acoes-card">' + (st[0] !== "postado" ? '<button type="button" class="btn" data-avanca>Mover pra ' + STATUS_IDEIA[k + 1][1] + '</button>' : '') + '</div></article>';
      }).join("") : '<p class="vazio">Vazio</p>') + '</div>';
  }).join("") + '</div>';

  $$("#quadro-ideias .ideia-card").forEach(function (card) {
    card.addEventListener("click", function (ev) {
      var i = E.ideias.find(function (x) { return x.id === card.dataset.id; });
      if (ev.target.closest("[data-avanca]")) {
        var idx = STATUS_IDEIA.findIndex(function (x) { return x[0] === i.status; });

        return;

function abreModalIdeia(i) {

  var corpo =
    '<div class="form-grade">' +

    '<div class="campo"><label>Etapa</label><select id="f-istatus">' + STATUS_IDEIA.map(function (s) { return '<option value="' + s[0] + '"' + (i && i.status === s[0] ? " selected" : "") + '>' + s[1] + '</option>'; }).join("") + '</select></div>' +
    '<div class="campo inteiro"><label>Gancho (a primeira frase)</label><input id="f-igancho" value="' + esc(i ? i.gancho : "") + '"></div>' +
    '<div class="campo inteiro"><label>Anotações</label><textarea id="f-iobs">' + esc(i ? i.obs : "") + '</textarea></div>' +
    '</div>';
  abreModal({
    titulo: i ? "Editar ideia" : "Nova ideia",

      var titulo = $("#f-ititulo").value.trim();

      return salvar("found_ideias", linha, i ? i.id : null).then(function (ok) { if (ok) { fechaModal(); carregaIdeias(); } return ok ? "" : "Não foi possível salvar."; });

/* =========================================================
   13) ABA RADAR DE NOVIDADES
   ========================================================= */
var radarFiltro = { status: "ativas", cat: "", texto: "" };
function carregaRadar() {
  var raiz = $("#aba-radar");
  raiz.innerHTML =
    '<section class="card bloco"><div class="bloco-topo"><h2>Onde procurar novidades</h2></div><div class="fontes">' +
    FONTES_RADAR.map(function (f) { return '<a href="' + esc(f[1]) + '" target="_blank" rel="noopener">' + esc(f[0]) + ' ' + icone("abrir") + '</a>'; }).join("") + '</div></section>' +
    '<section class="card bloco"><div class="bloco-topo">' +
    '<div class="seg" role="group" aria-label="Filtrar por situação" id="radar-filtro-seg">' +
    [["ativas", "Ativas"], ["testar", "Quero testar"], ["usei", "Já usei"], ["arquivada", "Arquivadas"], ["todas", "Todas"]].map(function (f) { return '<button type="button" data-f="' + f[0] + '" aria-pressed="' + (f[0] === radarFiltro.status) + '">' + f[1] + '</button>'; }).join("") + '</div>' +
    '<select class="filtro" id="radar-cat"><option value="">Todas as categorias</option>' + CATEGORIAS_RADAR.map(function (c) { return "<option>" + c + "</option>"; }).join("") + '</select>' +
    '<div class="campo-busca">' + icone("busca") + '<input type="search" id="radar-busca" placeholder="Buscar"></div>' +
    '<div class="dir"><button type="button" class="btn escuro" id="radar-novo">' + icone("mais") + 'Salvar novidade</button></div></div>' +
    '<div id="grade-radar"><p class="vazio">Carregando...</p></div></section>';

  buscaTudo("found_radar", "criado_em", false).then(function (lista) { E.radar = lista; desenhaRadar(); });

  $("#radar-filtro-seg").addEventListener("click", function (ev) {
    var b = ev.target.closest("button"); if (!b) return;
    radarFiltro.status = b.dataset.f;
    $$("#radar-filtro-seg button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
    desenhaRadar();
  });
  $("#radar-cat").addEventListener("change", function () { radarFiltro.cat = this.value; desenhaRadar(); });
  $("#radar-busca").addEventListener("input", function () { radarFiltro.texto = this.value; desenhaRadar(); });
  $("#radar-novo").addEventListener("click", function () { abreModalRadar(null); });
}
function desenhaRadar() {
  var alvo = $("#grade-radar"); if (!alvo) return;
  var t = radarFiltro.texto.trim().toLowerCase();
  var lista = E.radar.filter(function (n) {
    var st = n.status || "nova";
    if (radarFiltro.status === "ativas" && (st === "usei" || st === "arquivada")) return false;
    if (radarFiltro.status !== "ativas" && radarFiltro.status !== "todas" && st !== radarFiltro.status) return false;
    if (radarFiltro.cat && n.categoria !== radarFiltro.cat) return false;
    return !t || [n.titulo, n.nota].some(function (x) { return String(x || "").toLowerCase().indexOf(t) > -1; });
  }).sort(function (a, b) { if (!!a.fixada !== !!b.fixada) return a.fixada ? -1 : 1; return String(b.criado_em || "").localeCompare(String(a.criado_em || "")); });

  if (!E.radar.length) { alvo.innerHTML = '<p class="vazio">Seu radar está vazio. Viu uma tendência, uma oportunidade ou um caso de sucesso? Clique em Salvar novidade.</p>'; return; }
  if (!lista.length) { alvo.innerHTML = '<p class="vazio">Nada com esse filtro.</p>'; return; }

  alvo.innerHTML = '<div class="grade-radar">' + lista.map(function (n) {
    var link = urlSegura(n.link);
    return '<article class="card radar-card' + (n.fixada ? " fixada" : "") + '" tabindex="0" data-id="' + n.id + '">' +
      '<div class="radar-topo"><span class="pilula ' + (COR_RADAR[n.categoria] || "p-cinza") + '">' + esc(n.categoria || "Outro") + '</span>' +
      '<button type="button" class="icone fixa" data-fixa aria-pressed="' + !!n.fixada + '" aria-label="' + (n.fixada ? "Desafixar" : "Fixar no topo") + '">' + icone("pin") + '</button></div>' +
      '<h3>' + esc(n.titulo) + '</h3>' + (n.nota ? '<p class="nota">' + esc(n.nota) + '</p>' : '') +
      '<div class="radar-pe"><span class="fraco" style="font-size:.76rem">' + haQuanto(n.criado_em) + '</span>' +
      '<select data-status>' + STATUS_RADAR.map(function (s) { return '<option value="' + s[0] + '"' + ((n.status || "nova") === s[0] ? " selected" : "") + '>' + s[1] + '</option>'; }).join("") + '</select>' +
      (link ? '<a class="btn" href="' + esc(link) + '" target="_blank" rel="noopener">Abrir</a>' : '') + '</div></article>';
  }).join("") + '</div>';

  $$("#grade-radar [data-fixa]").forEach(function (b) {
    b.addEventListener("click", function (ev) {
      ev.stopPropagation();
      var n = E.radar.find(function (x) { return x.id === b.closest("[data-id]").dataset.id; });
      salvar("found_radar", { fixada: !n.fixada }, n.id).then(function (ok) { if (ok) { n.fixada = !n.fixada; desenhaRadar(); } });
    });
  });
  $$("#grade-radar [data-status]").forEach(function (sel) {
    sel.addEventListener("click", function (ev) { ev.stopPropagation(); });
    sel.addEventListener("change", function () {
      var n = E.radar.find(function (x) { return x.id === sel.closest("[data-id]").dataset.id; });
      var antes = n.status;
      salvar("found_radar", { status: sel.value }, n.id).then(function (ok) { if (!ok) { sel.value = antes; return; } n.status = sel.value; toast("Atualizado"); });
    });
  });
  $$("#grade-radar .radar-card").forEach(function (card) {
    card.addEventListener("click", function (ev) {
      if (ev.target.closest("a, select, [data-fixa]")) return;
      abreModalRadar(E.radar.find(function (x) { return x.id === card.dataset.id; }));
    });
  });
}
function abreModalRadar(n) {
  var corpo =
    '<div class="form-grade">' +
    '<div class="campo inteiro"><label>O que é</label><input id="f-rtitulo" value="' + esc(n ? n.titulo : "") + '"></div>' +
    '<div class="campo"><label>Categoria</label><select id="f-rcat">' + CATEGORIAS_RADAR.map(function (c) { return '<option' + (n && n.categoria === c ? " selected" : "") + '>' + c + '</option>'; }).join("") + '</select></div>' +
    '<div class="campo"><label>Situação</label><select id="f-rstatus">' + STATUS_RADAR.map(function (s) { return '<option value="' + s[0] + '"' + (n && n.status === s[0] ? " selected" : "") + '>' + s[1] + '</option>'; }).join("") + '</select></div>' +
    '<div class="campo inteiro"><label>Link (onde viu)</label><input id="f-rlink" value="' + esc(n ? n.link : "") + '" placeholder="https://..."></div>' +
    '<div class="campo inteiro"><label>Anotação: o que é e como usar</label><textarea id="f-rnota">' + esc(n ? n.nota : "") + '</textarea></div>' +
    '<div class="campo check inteiro"><label><input type="checkbox" id="f-rfixa" ' + (n && n.fixada ? "checked" : "") + '> Fixar no topo</label></div>' +
    '</div>';
  abreModal({
    titulo: n ? "Editar novidade" : "Salvar novidade",
    corpo: corpo,
    excluir: n ? function () { confirmaApagar("found_radar", n.id, function () { fechaModal(); carregaRadar(); }); } : null,
    salvar: function () {
      var titulo = $("#f-rtitulo").value.trim();
      if (!titulo) return "Informe o que é.";
      var linha = { titulo: titulo, categoria: $("#f-rcat").value, status: $("#f-rstatus").value, link: urlSegura($("#f-rlink").value.trim()) || null, nota: $("#f-rnota").value.trim() || null, fixada: $("#f-rfixa").checked };
      return salvar("found_radar", linha, n ? n.id : null).then(function (ok) { if (ok) { fechaModal(); carregaRadar(); } return ok ? "" : "Não foi possível salvar."; });
    }
  });
}

/* =========================================================
   14) ABA LINKS ÚTEIS
   ========================================================= */
var linksBusca = "";
function carregaLinks() {
  var raiz = $("#aba-links");
  raiz.innerHTML =
    '<section class="card bloco"><div class="bloco-topo">' +
    '<div class="campo-busca">' + icone("busca") + '<input type="search" id="links-busca" placeholder="Buscar link"></div>' +
    '<span class="contagem" id="links-contagem"></span>' +
    '<div class="dir"><button type="button" class="btn escuro" id="links-novo">' + icone("mais") + 'Adicionar link</button></div></div></section>' +
    '<div id="grupos-links"><p class="vazio">Carregando...</p></div>';

  buscaTudo("found_links", "titulo").then(function (lista) { E.links = lista; desenhaLinks(); });

  $("#links-busca").addEventListener("input", function () { linksBusca = this.value; desenhaLinks(); });
  $("#links-novo").addEventListener("click", function () { abreModalLink(null); });
}
function desenhaLinks() {
  var alvo = $("#grupos-links"); if (!alvo) return;
  var t = linksBusca.trim().toLowerCase();
  var lista = E.links.filter(function (l) { return !t || [l.titulo, l.url, l.descricao, l.categoria].some(function (x) { return String(x || "").toLowerCase().indexOf(t) > -1; }); });
  $("#links-contagem").textContent = lista.length + (lista.length === 1 ? " link" : " links");

  if (!E.links.length) { alvo.innerHTML = '<div class="card bloco"><p class="vazio">Nenhum link ainda. Clique em Adicionar link pra guardar os sites e ferramentas de trabalho.</p></div>'; return; }
  if (!lista.length) { alvo.innerHTML = '<div class="card bloco"><p class="vazio">Nenhum link com essa busca.</p></div>'; return; }

  var grupos = [];
  var favs = lista.filter(function (l) { return l.favorito; });
  if (favs.length) grupos.push(["★ Favoritos", favs]);
  var cats = CATEGORIAS_LINK.concat(lista.map(function (l) { return l.categoria || "Outros"; }).filter(function (c, i, a) { return CATEGORIAS_LINK.indexOf(c) < 0 && a.indexOf(c) === i; }));
  cats.forEach(function (c) {
    var itens = lista.filter(function (l) { return (l.categoria || "Outros") === c; });
    if (itens.length) grupos.push([c, itens]);
  });

  alvo.innerHTML = '<div class="grupos-links">' + grupos.map(function (g) {
    return '<section class="card"><h2>' + esc(g[0]) + ' <span>' + g[1].length + '</span></h2><ul>' + g[1].map(function (l) {
      var url = urlSegura(l.url), nome = l.titulo || hostDe(l.url);
      return '<li class="link-li" data-id="' + l.id + '"><span class="letra" aria-hidden="true">' + esc((nome.charAt(0) || "?").toUpperCase()) + '</span>' +
        '<div>' + (url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(nome) + '</a>' : '<b>' + esc(nome) + '</b>') +
        '<small>' + esc(l.descricao || hostDe(l.url)) + '</small></div>' +
        '<button type="button" class="estrela" data-fav aria-pressed="' + !!l.favorito + '" aria-label="' + (l.favorito ? "Tirar dos favoritos" : "Favoritar") + '">' + icone("estrela") + '</button>' +
        '<button type="button" class="icone" data-edita aria-label="Editar link">' + icone("lapis") + '</button></li>';
    }).join("") + '</ul></section>';
  }).join("") + '</div>';

  $$("#grupos-links [data-fav]").forEach(function (b) {
    b.addEventListener("click", function () {
      var l = E.links.find(function (x) { return x.id === b.closest("[data-id]").dataset.id; });
      salvar("found_links", { favorito: !l.favorito }, l.id).then(function (ok) { if (ok) { l.favorito = !l.favorito; desenhaLinks(); } });
    });
  });
  $$("#grupos-links [data-edita]").forEach(function (b) {
    b.addEventListener("click", function () { abreModalLink(E.links.find(function (x) { return x.id === b.closest("[data-id]").dataset.id; })); });
  });
}
function abreModalLink(l) {
  var corpo =
    '<div class="form-grade">' +
    '<div class="campo inteiro"><label>Nome</label><input id="f-ltitulo" value="' + esc(l ? l.titulo : "") + '"></div>' +
    '<div class="campo"><label>Categoria</label><select id="f-lcat">' + (l && l.categoria && CATEGORIAS_LINK.indexOf(l.categoria) < 0 ? CATEGORIAS_LINK.concat([l.categoria]) : CATEGORIAS_LINK).map(function (c) { return '<option' + (l && l.categoria === c ? " selected" : "") + '>' + c + '</option>'; }).join("") + '</select></div>' +
    '<div class="campo"><label>Endereço</label><input id="f-lurl" value="' + esc(l ? l.url : "") + '" placeholder="https://..."></div>' +
    '<div class="campo inteiro"><label>Pra que serve</label><input id="f-ldesc" value="' + esc(l ? l.descricao : "") + '"></div>' +
    '<div class="campo check inteiro"><label><input type="checkbox" id="f-lfav" ' + (l && l.favorito ? "checked" : "") + '> Favorito</label></div>' +
    '</div>';
  abreModal({
    titulo: l ? "Editar link" : "Adicionar link",
    corpo: corpo,
    excluir: l ? function () { confirmaApagar("found_links", l.id, function () { fechaModal(); carregaLinks(); }); } : null,
    salvar: function () {
      var nome = $("#f-ltitulo").value.trim();
      if (!nome) return "Informe o nome.";
      var url = urlSegura($("#f-lurl").value.trim());
      if (!url) return "Esse endereço não parece um site. Comece com https://";
      var linha = { titulo: nome, categoria: $("#f-lcat").value, url: url, descricao: $("#f-ldesc").value.trim() || null, favorito: $("#f-lfav").checked };
      return salvar("found_links", linha, l ? l.id : null).then(function (ok) { if (ok) { fechaModal(); carregaLinks(); } return ok ? "" : "Não foi possível salvar."; });
    }
  });
}

/* =========================================================
   15) JANELA (MODAL) GENÉRICA
   ========================================================= */
function abreModal(opcoes) {
  fechaModal();
  var fundo = document.createElement("div");
  fundo.className = "fundo-modal";
  fundo.id = "janela-modal";
  fundo.innerHTML =
    '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-tit">' +
    '<div class="modal-topo"><div><h2 id="modal-tit">' + esc(opcoes.titulo) + '</h2></div><button class="icone" type="button" id="modal-fechar" aria-label="Fechar">' + icone("x") + "</button></div>" +
    '<div id="modal-corpo">' + opcoes.corpo + "</div>" +
    '<div class="erro-form" id="modal-erro" hidden></div>' +
    '<div class="modal-pe">' +
    (opcoes.excluir ? '<button class="btn perigo" type="button" id="modal-excluir">' + icone("lixo") + "Excluir</button>" : "") +
    (opcoes.semSalvar ? "" : '<div class="dir"><button class="btn" type="button" id="modal-cancelar">Cancelar</button><button class="btn escuro" type="button" id="modal-salvar">Salvar</button></div>') +
    "</div></div>";
  document.body.appendChild(fundo);
  fundo.addEventListener("click", function (ev) { if (ev.target === fundo) fechaModal(); });
  $("#modal-fechar").addEventListener("click", fechaModal);
  if ($("#modal-cancelar")) $("#modal-cancelar").addEventListener("click", fechaModal);
  if (opcoes.excluir) $("#modal-excluir").addEventListener("click", opcoes.excluir);
  if ($("#modal-salvar")) {
    $("#modal-salvar").addEventListener("click", function () {
      var btn = $("#modal-salvar");
      btn.disabled = true;
      var resultado = opcoes.salvar();
      Promise.resolve(resultado).then(function (erro) {
        btn.disabled = false;
        if (erro) { $("#modal-erro").hidden = false; $("#modal-erro").textContent = erro; }
      });
    });
  }
  document.addEventListener("keydown", escFechaModal);
}
function escFechaModal(ev) { if (ev.key === "Escape") fechaModal(); }
function fechaModal() {
  var m = $("#janela-modal");
  if (m) m.remove();
  document.removeEventListener("keydown", escFechaModal);
}
function confirmaApagar(tabela, id, depois) {
  if (!confirm("Tem certeza que quer apagar este item? Essa ação não pode ser desfeita.")) return;
  apagar(tabela, id).then(function (ok) { if (ok) { toast("Apagado."); depois(); } });
}
</script>
