<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Entrar | Painel Found</title>
<meta name="description" content="Acesso ao painel interno da Found.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='210 90 125 125'%3E%3Ccircle cx='271.5' cy='150.5' r='62' fill='%230a0a0a'/%3E%3Cpath fill='%23c8f000' d='M271.3 119.7Q277.6 144.9 302.8 151.2Q277.6 157.5 271.3 182.7Q265.0 157.5 239.8 151.2Q265.0 144.9 271.3 119.7Z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f4f2; --card:#fff; --ink:#0a0a0a; --muted:#55584f; --line:#e3e3df;
  --lime:#c8f000; --lime-deep:#a9cc00; --lime-soft:#f1fbc2;
  --erro-bg:#fdecec; --erro:#a3161a; --ok-bg:#f1fbc2; --ok:#33430a;
  --radius:20px;
  --shadow:0 1px 2px rgba(10,10,10,.05),0 18px 40px -16px rgba(10,10,10,.25);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);font-family:'Montserrat',system-ui,sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.cartao{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 24px}
.topo{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.logo-svg{height:24px;width:auto;display:block;color:var(--ink)}
h1{font-size:1.2rem;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px;font-size:.88rem}
.faixa{border-radius:12px;padding:10px 12px;font-weight:600;font-size:.86rem;margin-bottom:14px}
.faixa.erro{background:var(--erro-bg);color:var(--erro)}
.faixa.ok{background:var(--ok-bg);color:var(--ok)}
.faixa[hidden]{display:none}
label{display:block;font-weight:700;font-size:.84rem;margin-bottom:6px}
input{width:100%;font:inherit;color:inherit;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;margin-bottom:14px}
input:focus{outline:none;border-color:var(--ink);background:#fff;box-shadow:0 0 0 3px var(--lime)}
.btn{width:100%;font:inherit;font-weight:800;min-height:44px;border-radius:12px;border:2px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
.link{display:inline-block;margin-top:14px;background:none;border:0;padding:0;font:inherit;font-size:.86rem;font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:8px}
.btn:focus-visible{box-shadow:0 0 0 6px var(--lime)}
.voltar{display:block;text-align:center;margin-top:16px;font-size:.82rem;color:var(--muted)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="cartao">
  <div class="topo">
    <svg class="logo-svg" viewBox="92 52 626 214" role="img" aria-label="Found">
      <path fill="currentColor" fill-rule="evenodd" d="M107.2 67L226.9 67Q228.5 67 228.5 68.6L228.5 97.7Q228.5 99.3 226.9 99.3L142.7 99.3Q141.9 99.3 141.9 100.1L141.9 123.6Q141.9 124.4 142.7 124.4L207.3 124.4Q208.9 124.4 208.9 126L208.9 155Q208.9 156.6 207.3 156.6L142.7 156.6Q141.9 156.6 141.9 157.4L141.9 199.7Q141.9 201.3 140.3 201.3L107.2 201.3Q105.6 201.3 105.6 199.7L105.6 68.6Q105.6 67 107.2 67ZM326 151.2C326 181.62 303.74 202.7 271.6 202.7C239.46 202.7 217.2 181.62 217.2 151.2C217.2 120.78 239.46 99.7 271.6 99.7C303.74 99.7 326 120.78 326 151.2ZM288.56 168.51C304.12 152.95 304.12 149.35 288.56 133.79C273 118.23 269.4 118.23 253.84 133.79C238.28 149.35 238.28 152.95 253.84 168.51C269.4 184.07 273 184.07 288.56 168.51ZM332.6 100.6L362.8 100.6Q364.1 100.6 364.1 101.9L364.1 154.4A18.05 18.05 0 0 0 400.2 154.4L400.2 101.9Q400.2 100.6 401.5 100.6L432 100.6Q433.3 100.6 433.3 101.9L433.3 198.95Q433.3 200.25 432 200.25L401.7 200.25Q400.2 200.25 400.2 198.75L400.2 190.65A40 40 0 0 1 371.3 203C347.3 203 331.3 187 331.3 163L331.3 101.9Q331.3 100.6 332.6 100.6ZM443 100.5L472.1 100.5Q473.4 100.5 473.4 101.8L473.4 112.6A40 40 0 0 1 503.9 98.5C527.9 98.5 543.9 114.5 543.9 138.5L543.9 198.95Q543.9 200.25 542.6 200.25L512.3 200.25Q511 200.25 511 198.95L511 147.5A18.15 18.15 0 0 0 474.7 147.5L474.7 198.95Q474.7 200.25 473.4 200.25L443 200.25Q441.7 200.25 441.7 198.95L441.7 101.8Q441.7 100.5 443 100.5ZM622.7 63.5L655.1 63.5Q656.4 63.5 656.4 64.8L656.4 198.9Q656.4 200.2 655.1 200.2L627.7 200.2Q626.2 200.2 626.2 198.7L626.2 188.94C618.32 197.27 607.39 202 594.4 202C567.16 202 549 181.21 549 150.05C549 118.89 567.16 98.1 594.4 98.1C604.93 98.1 614.11 101.21 621.4 106.82L621.4 64.8Q621.4 63.5 622.7 63.5ZM624.2 150.5C624.2 163.07 615.39 172 603 172C590.61 172 581.8 163.07 581.8 150.5C581.8 137.93 590.61 129 603 129C615.39 129 624.2 137.93 624.2 150.5Z"/>
      <path fill="#c8f000" d="M271.3 133.7Q274.8 147.7 288.8 151.2Q274.8 154.7 271.3 168.7Q267.8 154.7 253.8 151.2Q267.8 147.7 271.3 133.7Z"/>
      <circle cx="685.7" cy="179.8" r="20.1" fill="currentColor"/>
    </svg>
  </div>

  <!-- ENTRAR -->
  <section id="tela-entrar" aria-labelledby="t-entrar">
    <h1 id="t-entrar">Entrar</h1>
    <p class="sub">Painel interno da Found.</p>
    <div class="faixa erro" id="aviso-entrar" hidden></div>
    <form id="form-entrar">
      <label for="email-entrar">E-mail</label>
      <input type="email" id="email-entrar" autocomplete="username" required>
      <label for="senha-entrar">Senha</label>
      <input type="password" id="senha-entrar" autocomplete="current-password" required>
      <button class="btn" type="submit" id="btn-entrar">Entrar</button>
    </form>
    <button class="link" type="button" id="ir-recuperar">Esqueci minha senha</button>
  </section>

  <!-- RECUPERAR SENHA -->
  <section id="tela-recuperar" aria-labelledby="t-recuperar" hidden>
    <h1 id="t-recuperar">Recuperar senha</h1>
    <p class="sub">Informe o e-mail da conta e eu envio um link para redefinir a senha.</p>
    <div class="faixa erro" id="aviso-recuperar" hidden></div>
    <div class="faixa ok" id="ok-recuperar" hidden></div>
    <form id="form-recuperar">
      <label for="email-recuperar">E-mail</label>
      <input type="email" id="email-recuperar" autocomplete="username" required>
      <button class="btn" type="submit" id="btn-recuperar">Enviar link</button>
    </form>
    <button class="link" type="button" id="ir-entrar">Voltar para entrar</button>
  </section>

  <a class="voltar" href="../">← Voltar para o site</a>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/banco.js"></script>
<script>
(function () {
  var banco = window.banco;
  var telaEntrar = document.getElementById("tela-entrar");
  var telaRecuperar = document.getElementById("tela-recuperar");

  function mostraAviso(el, texto) {
    if (!texto) { el.hidden = true; el.textContent = ""; return; }
    el.hidden = false;
    el.textContent = texto;
  }

  function traduzErro(msg) {
    msg = String(msg || "");
    if (/invalid login credentials/i.test(msg)) return "E-mail ou senha incorretos.";
    if (/email not confirmed/i.test(msg)) return "Confirme seu e-mail antes de entrar.";
    return msg || "Não foi possível completar a ação. Tente novamente.";
  }

  // já logada? manda direto pro painel
  if (banco) {
    banco.auth.getSession().then(function (r) {
      if (r && r.data && r.data.session) location.replace("../admin/");
    });
  }

  document.getElementById("ir-recuperar").addEventListener("click", function () {
    telaEntrar.hidden = true;
    telaRecuperar.hidden = false;
  });
  document.getElementById("ir-entrar").addEventListener("click", function () {
    telaRecuperar.hidden = true;
    telaEntrar.hidden = false;
  });

  document.getElementById("form-entrar").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var avisoEl = document.getElementById("aviso-entrar");
    mostraAviso(avisoEl, "");
    if (!banco) { mostraAviso(avisoEl, "Não consegui carregar a ligação com o banco. Confira o arquivo js/banco.js e a internet."); return; }
    var email = document.getElementById("email-entrar").value.trim();
    var senha = document.getElementById("senha-entrar").value;
    var btn = document.getElementById("btn-entrar");
    btn.disabled = true;
    banco.auth.signInWithPassword({ email: email, password: senha }).then(function (r) {
      btn.disabled = false;
      if (r.error) { mostraAviso(avisoEl, traduzErro(r.error.message)); return; }
      location.replace("../admin/");
    }).catch(function () {
      btn.disabled = false;
      mostraAviso(avisoEl, "Não foi possível entrar agora. Tente de novo em instantes.");
    });
  });

  document.getElementById("form-recuperar").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var avisoEl = document.getElementById("aviso-recuperar");
    var okEl = document.getElementById("ok-recuperar");
    mostraAviso(avisoEl, "");
    mostraAviso(okEl, "");
    if (!banco) { mostraAviso(avisoEl, "Não consegui carregar a ligação com o banco."); return; }
    var email = document.getElementById("email-recuperar").value.trim();
    var btn = document.getElementById("btn-recuperar");
    btn.disabled = true;
    banco.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname.replace(/login\/?$/, "admin/") }).then(function (r) {
      btn.disabled = false;
      if (r.error) { mostraAviso(avisoEl, traduzErro(r.error.message)); return; }
      mostraAviso(okEl, "Se esse e-mail tiver uma conta, enviamos um link de redefinição.");
    }).catch(function () {
      btn.disabled = false;
      mostraAviso(avisoEl, "Não foi possível enviar agora. Tente de novo em instantes.");
    });
  });
})();
</script>
</body>
</html>
